name: Build and Test

on:
  pull_request:
    types: [opened, reopened, synchronize]

env:
  XCRESULTS_DIR_PATH: Results
  UI_TESTS_OUTPUT_DIR: UITestsOutput
  UI_TESTS_SIM_RECORDING_PID_PATH: /tmp/ui_tests_simulator_recording.pid

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v1
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.0.1'
    - name: Logs
      run: |
        /usr/bin/xcodebuild -version
        xcrun swift -version
    - name: Install Dependencies
      run: |
        ./.scripts/installBrewDependencyIfNeeded.sh xcbeautify xcodegen swiftlint swiftgen
    - name: Unit Tests
      run: |
        make -f .ci-cd/build_and_test.mk -B unit_tests
    - name: UI Tests
      run: |
        make -f .ci-cd/build_and_test.mk -B ui_tests
    - name: Prepare xcresult
      if: always()
      run: |
        ./.scripts/prepareXcresults.sh
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: UITestsOutput
        path: ${{ env.UI_TESTS_OUTPUT_DIR }}
    - name: Run Danger
      if: always()
      run: |
        bundle install
        bundle exec danger
      env:
        DANGER_GITHUB_API_TOKEN: ${{ secrets.DANGER_GITHUB_API_TOKEN }}
